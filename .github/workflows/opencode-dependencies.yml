name: opencode-dependencies
on:
  schedule:
    - cron: "45 3 * * 4"
  workflow_dispatch:
concurrency:
  group: opencode-dependencies
  cancel-in-progress: true
jobs:
  dependencies:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      pull-requests: write
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          distribution: temurin
          java-version: "21"
      - name: Prepare dependency environment
        shell: bash
        run: |
          npm ci --prefix backend --ignore-scripts
          cp Astroloji/app/google-services.example.json Astroloji/app/google-services.json
      - name: Select a currently free OpenCode model
        id: free_model
        run: node scripts/select-opencode-free-model.mjs
      - name: Install checksum-pinned OpenCode CLI
        shell: bash
        run: bash scripts/install-opencode-ci.sh
      - name: Weekly dependency curator
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MODEL: ${{ steps.free_model.outputs.model }}
          OPENCODE_DEFAULT_AGENT: maintainer
          OPENCODE_GIT_WRITE: "true"
          PROMPT: |
            Audit dependency pins against current authoritative release notes and security advisories.
            Follow the dependency-upgrade skill.
            Make at most ONE coherent upgrade PR per run, only when compatibility can be demonstrated
            by the repository's deterministic gates. Prefer security fixes and patch/minor updates, then
            justified major upgrades with migration evidence. Never silently combine unrelated major
            platform upgrades. Sensitive AGP/Kotlin/KSP, Play Billing, Firebase, Hono/Wrangler runtime,
            auth, migration, or release-tool changes use the elevated autonomous tier and may merge only
            after every exact-head gate passes. Constitutional automation-control, credential, or branch-
            policy changes must remain human-controlled.
        shell: bash
        run: bash scripts/run-opencode-github-ci.sh
