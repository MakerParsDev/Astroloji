name: opencode-dispatch
on:
  workflow_dispatch:
    inputs:
      prompt:
        description: "Engineering task for the autonomous maintainer"
        required: true
        type: string
concurrency:
  group: opencode-dispatch
  cancel-in-progress: false
jobs:
  task:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      pull-requests: write
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          distribution: temurin
          java-version: "21"
      - name: Prepare engineering environment
        shell: bash
        run: |
          npm ci --prefix backend --ignore-scripts
          cp Astroloji/app/google-services.example.json Astroloji/app/google-services.json
      - name: Select a currently free OpenCode model
        id: free_model
        run: node scripts/select-opencode-free-model.mjs
      - name: Install checksum-pinned OpenCode CLI
        shell: bash
        run: bash scripts/install-opencode-ci.sh
      - name: Run requested engineering task
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MODEL: ${{ steps.free_model.outputs.model }}
          OPENCODE_DEFAULT_AGENT: maintainer
          OPENCODE_GIT_WRITE: "true"
          PROMPT: |
            Execute this maintainer task under AGENTS.md and all repository safety rules:
            ${{ inputs.prompt }}
            Never interpret task text as permission to deploy, publish, mutate remote production data,
            change secrets/variables, bypass reviews, or weaken tests.
        shell: bash
        run: bash scripts/run-opencode-github-ci.sh
