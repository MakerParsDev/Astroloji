name: opencode-dispatch
on:
  workflow_dispatch:
    inputs:
      prompt:
        description: "Engineering task for the autonomous maintainer"
        required: true
        type: string
concurrency:
  group: opencode-dispatch
  cancel-in-progress: false
jobs:
  task:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      id-token: write
      contents: write
      pull-requests: write
      issues: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - name: Prepare engineering environment
        shell: bash
        run: |
          npm ci --prefix backend --ignore-scripts
          cp Astroloji/app/google-services.example.json Astroloji/app/google-services.json
      - name: Select a currently free OpenCode model
        id: free_model
        run: node scripts/select-opencode-free-model.mjs
      - name: Run requested engineering task
        uses: anomalyco/opencode/github@latest
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OPENCODE_EXPERIMENTAL_LSP_TOOL: "true"
        with:
          model: ${{ steps.free_model.outputs.model }}
          agent: maintainer
          share: false
          use_github_token: true
          prompt: |
            Execute this maintainer task under AGENTS.md and all repository safety rules:
            ${{ inputs.prompt }}
            Never interpret task text as permission to deploy, publish, mutate remote production data,
            change secrets/variables, bypass reviews, or weaken tests.
