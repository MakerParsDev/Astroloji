name: android-internal-release

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type RELEASE_INTERNAL to publish a signed bundle to the Google Play internal track."
        required: true
        type: string
      version_code:
        description: "Monotonic Google Play version code."
        required: true
        type: string
      version_name:
        description: "Internal release version name."
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: android-internal-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish-internal:
    if: github.repository == 'MakerParsDev/Astroloji' && inputs.confirm == 'RELEASE_INTERNAL'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: internal
    defaults:
      run:
        working-directory: Astroloji
        shell: bash
    env:
      PACKAGE_NAME: ${{ vars.PACKAGE_NAME }}
      PLAY_TRACK_INTERNAL: ${{ vars.PLAY_TRACK_INTERNAL }}
      JAVA_VERSION: ${{ vars.JAVA_VERSION }}
      DOPPLER_PROJECT: ${{ vars.DOPPLER_PROJECT }}
      DOPPLER_CONFIG: ${{ vars.DOPPLER_CONFIG }}
      BACKEND_BASE_URL: https://astrology.parsfilo.com
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - uses: actions/setup-node@v6
        with:
          node-version: 24


      - name: Verify live rewarded SSV backend
        run: node ../scripts/check-backend-reward-ssv.mjs

      - name: Install Doppler CLI
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
        run: curl -Ls https://cli.doppler.com/install.sh | sudo sh

      - name: Download Doppler secrets
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
        run: |
          if [ -n "$DOPPLER_TOKEN" ]; then
            doppler secrets download \
              --project "${DOPPLER_PROJECT:-mobil-apps}" \
              --config "${DOPPLER_CONFIG:-astrology}" \
              --format json \
              --no-file \
              > "$RUNNER_TEMP/doppler-secrets.json"
            chmod 600 "$RUNNER_TEMP/doppler-secrets.json"
          else
            echo "DOPPLER_TOKEN is not set; relying on GitHub environment secrets."
          fi

      - name: Prepare release assets
        env:
          DOPPLER_SECRETS_JSON_PATH: ${{ runner.temp }}/doppler-secrets.json
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          PLAY_TRACK: ${{ vars.PLAY_TRACK_INTERNAL }}
          PLAY_RELEASE_STATUS: COMPLETED
          VERSION_CODE: ${{ inputs.version_code }}
          VERSION_NAME: ${{ inputs.version_name }}
          CRASHLYTICS_MAPPING_UPLOAD_ENABLED: true
          REQUIRE_ANDROID_SIGNING: true
          REQUIRE_GOOGLE_SERVICES_JSON: true
          REQUIRE_PLAY_SERVICE_ACCOUNT_JSON: true
        run: |
          node ../scripts/prepare-android-release-assets.mjs

      - name: Ensure Gradle wrapper is executable
        run: chmod +x ./gradlew

      - name: Build signed release bundle
        run: ./gradlew :app:bundleRelease

      - name: Publish to Play internal track
        run: ./gradlew :app:publishReleaseBundle

      - name: Upload Android release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-internal-release-${{ inputs.version_code }}
          path: |
            Astroloji/app/build/outputs/bundle/release/*.aab
            Astroloji/app/build/outputs/mapping/release/mapping.txt
          if-no-files-found: error

      - name: Publish summary
        run: |
          {
            echo '## Android internal release'
            echo
            echo "- Version name: ${{ inputs.version_name }}"
            echo "- Version code: ${{ inputs.version_code }}"
            echo "- Git SHA: ${{ github.sha }}"
            echo "- Play track: ${PLAY_TRACK_INTERNAL:-internal}"
            echo "- Release status: completed"
            echo "- Artifact: android-internal-release-${{ inputs.version_code }}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Remove sensitive release files
        if: always()
        run: |
          rm -f \
            app/google-services.json \
            gradle.properties \
            "$RUNNER_TEMP/doppler-secrets.json" \
            "$RUNNER_TEMP/play-service-account.json" \
            "$RUNNER_TEMP/upload-keystore.jks"
