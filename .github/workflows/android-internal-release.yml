name: android-internal-release

on:
  workflow_call:
    inputs:
      autonomous:
        required: false
        default: false
        type: boolean
      release_sha:
        required: true
        type: string
      version_code:
        required: false
        default: ''
        type: string
      version_name:
        required: false
        default: ''
        type: string
    outputs:
      version_code:
        value: ${{ jobs.publish-internal.outputs.version_code }}
      version_name:
        value: ${{ jobs.publish-internal.outputs.version_name }}
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type RELEASE_INTERNAL to publish a signed bundle to the Google Play internal track."
        required: true
        type: string
      release_sha:
        description: "Optional exact main SHA. Defaults to the dispatched main commit."
        required: false
        default: ''
        type: string
      version_code:
        description: "Monotonic Google Play version code."
        required: true
        type: string
      version_name:
        description: "Internal release version name."
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: android-internal-release-${{ inputs.release_sha || github.ref }}
  cancel-in-progress: false

jobs:
  publish-internal:
    if: >-
      github.repository == 'MakerParsDev/Astroloji' &&
      (inputs.autonomous == true ||
       (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.confirm == 'RELEASE_INTERNAL'))
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: internal
    outputs:
      version_code: ${{ steps.release_identity.outputs.version_code }}
      version_name: ${{ steps.release_identity.outputs.version_name }}
    defaults:
      run:
        working-directory: Astroloji
        shell: bash
    env:
      PACKAGE_NAME: ${{ vars.PACKAGE_NAME }}
      PLAY_TRACK_INTERNAL: ${{ vars.PLAY_TRACK_INTERNAL }}
      JAVA_VERSION: ${{ vars.JAVA_VERSION }}
      DOPPLER_PROJECT: ${{ vars.DOPPLER_PROJECT }}
      DOPPLER_CONFIG: ${{ vars.DOPPLER_CONFIG }}
      BACKEND_BASE_URL: https://astrology.parsfilo.com
      MINIMUM_INTERNAL_VERSION_CODE: "1101"
      RELEASE_SHA: ${{ inputs.release_sha || github.sha }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ env.RELEASE_SHA }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify immutable main release SHA
        run: |
          test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
          git fetch --no-tags --no-recurse-submodules origin main
          test "$(git rev-parse origin/main)" = "$RELEASE_SHA"

      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24


      - name: Verify live rewarded SSV backend
        run: node ../scripts/check-backend-reward-ssv.mjs

      - name: Install pinned Doppler CLI
        env:
          DOPPLER_VERSION: 3.76.1
          DOPPLER_SHA256: e35230bd21fdbd7e41ddcb24672ec61cecefdb22de244d0216ea6b59853f63f2
        run: |
          set -euo pipefail
          archive="doppler_${DOPPLER_VERSION}_linux_amd64.tar.gz"
          url="https://github.com/DopplerHQ/cli/releases/download/${DOPPLER_VERSION}/${archive}"
          curl --fail --silent --show-error --location \
            --proto '=https' --proto-redir '=https' \
            "$url" --output "$RUNNER_TEMP/$archive"
          echo "$DOPPLER_SHA256  $RUNNER_TEMP/$archive" | sha256sum --check
          mkdir -p "$RUNNER_TEMP/doppler-bin"
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP/doppler-bin" doppler
          chmod 0755 "$RUNNER_TEMP/doppler-bin/doppler"
          echo "$RUNNER_TEMP/doppler-bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/doppler-bin/doppler" --version

      - name: Download Doppler secrets
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
        run: |
          if [ -n "$DOPPLER_TOKEN" ]; then
            doppler secrets download \
              --project "${DOPPLER_PROJECT:-mobil-apps}" \
              --config "${DOPPLER_CONFIG:-astrology}" \
              --format json \
              --no-file \
              > "$RUNNER_TEMP/doppler-secrets.json"
            chmod 600 "$RUNNER_TEMP/doppler-secrets.json"
          else
            echo "DOPPLER_TOKEN is not set; relying on GitHub environment secrets."
          fi

      - name: Prepare release credentials and signing assets
        env:
          DOPPLER_SECRETS_JSON_PATH: ${{ runner.temp }}/doppler-secrets.json
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          PLAY_TRACK: ${{ vars.PLAY_TRACK_INTERNAL }}
          PLAY_RELEASE_STATUS: COMPLETED
          CRASHLYTICS_MAPPING_UPLOAD_ENABLED: true
          REQUIRE_ANDROID_SIGNING: true
          REQUIRE_GOOGLE_SERVICES_JSON: true
          REQUIRE_PLAY_SERVICE_ACCOUNT_JSON: true
        run: |
          node ../scripts/prepare-android-release-assets.mjs

      - name: Verify Google Play package access and version codes
        id: play_access
        env:
          PLAY_PACKAGE_NAME: ${{ env.PACKAGE_NAME }}
          PLAY_SERVICE_ACCOUNT_JSON_PATH: ${{ runner.temp }}/play-service-account.json
        run: node ../scripts/check-play-release-access.mjs

      - name: Resolve and validate release identity
        id: release_identity
        env:
          REQUESTED_VERSION_CODE: ${{ inputs.version_code }}
          REQUESTED_VERSION_NAME: ${{ inputs.version_name }}
          REQUIRED_VERSION_CODE: ${{ steps.play_access.outputs.recommended_version_code }}
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import { assertRequestedVersionCode } from '../scripts/check-play-release-access.mjs';
          const requested = process.env.REQUESTED_VERSION_CODE?.trim()
            || process.env.REQUIRED_VERSION_CODE;
          const versionCode = assertRequestedVersionCode(
            requested,
            process.env.REQUIRED_VERSION_CODE,
          );
          const versionName = process.env.REQUESTED_VERSION_NAME?.trim() || `1.0.${versionCode}`;
          if (!/^[0-9A-Za-z._-]{1,50}$/.test(versionName)) {
            throw new Error('Resolved Android version name contains unsupported characters.');
          }
          fs.appendFileSync(
            process.env.GITHUB_OUTPUT,
            `version_code=${versionCode}\nversion_name=${versionName}\n`,
          );
          NODE

      - name: Apply release identity to Gradle
        run: |
          sed -i '/^VERSION_CODE=/d;/^VERSION_NAME=/d' gradle.properties
          printf 'VERSION_CODE=%s\nVERSION_NAME=%s\n' \
            "${{ steps.release_identity.outputs.version_code }}" \
            "${{ steps.release_identity.outputs.version_name }}" >> gradle.properties

      - name: Ensure Gradle wrapper is executable
        run: chmod +x ./gradlew

      - name: Build signed release bundle
        run: ./gradlew :app:bundleRelease

      - name: Reverify current main immediately before production mutation
        run: |
          git fetch --no-tags --no-recurse-submodules origin main
          test "$(git rev-parse origin/main)" = "$RELEASE_SHA"

      - name: Publish to Play internal track
        run: ./gradlew :app:publishReleaseBundle

      - name: Upload Android release artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: android-internal-release-${{ steps.release_identity.outputs.version_code }}
          path: |
            Astroloji/app/build/outputs/bundle/release/*.aab
            Astroloji/app/build/outputs/mapping/release/mapping.txt
          if-no-files-found: error

      - name: Publish summary
        run: |
          {
            echo '## Android internal release'
            echo
            echo "- Version name: ${{ steps.release_identity.outputs.version_name }}"
            echo "- Version code: ${{ steps.release_identity.outputs.version_code }}"
            echo "- Git SHA: $RELEASE_SHA"
            echo "- Play track: ${PLAY_TRACK_INTERNAL:-internal}"
            echo "- Release status: completed"
            echo "- Artifact: android-internal-release-${{ steps.release_identity.outputs.version_code }}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Remove sensitive release files
        if: always()
        run: |
          rm -f \
            app/google-services.json \
            gradle.properties \
            "$RUNNER_TEMP/doppler-secrets.json" \
            "$RUNNER_TEMP/play-service-account.json" \
            "$RUNNER_TEMP/upload-keystore.jks"
