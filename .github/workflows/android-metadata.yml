name: android-metadata
run-name: android-metadata-${{ github.event_name == 'workflow_dispatch' && inputs.mode || 'push' }}-${{ github.event_name == 'workflow_dispatch' && inputs.authorization_correlation || github.sha }}

on:
  push:
    branches:
      - main
    paths:
      - Astroloji/play/**
      - scripts/validate-play-metadata.mjs
      - scripts/lib/play-*.mjs
      - scripts/*play-metadata.mjs
      - scripts/cleanup-play-locales.mjs
      - .github/workflows/android-metadata.yml
  workflow_dispatch:
    inputs:
      mode:
        description: Play metadata operation
        required: true
        default: validate
        type: choice
        options:
          - validate
          - backup
          - diff
          - publish
          - cleanup
          - readback
          - restore
      backup_run_id:
        description: Workflow run ID containing play-metadata-backup-<run-id>
        required: false
        default: ''
        type: string
      backup_sha256:
        description: Exact 64-character SHA-256 of the downloaded backup
        required: false
        default: ''
        type: string
      state_digest:
        description: Exact 64-character live state digest from cleanup dry-run
        required: false
        default: ''
        type: string
      removal_count:
        description: Exact unsupported locale count from cleanup dry-run
        required: false
        default: ''
        type: string
      confirmation:
        description: Exact digest-bound publication, cleanup, or restore confirmation
        required: false
        default: ''
        type: string
      authorization_correlation:
        description: Unique immutable UUID correlation for publish, cleanup, or restore authorization
        required: false
        default: ''
        type: string
      track:
        description: Optional release-notes track for publish mode
        required: false
        default: ''
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: android-metadata-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate-metadata:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Validate Play metadata and assets
        run: |
          node scripts/validate-play-metadata.mjs
          node --test \
            scripts/play-store-config.test.mjs \
            scripts/play-copy-quality.test.mjs \
            scripts/play-assets.test.mjs \
            scripts/play-diff.test.mjs \
            scripts/play-publication.test.mjs \
            scripts/play-locale-cleanup.test.mjs \
            scripts/play-workflow-contract.test.mjs \
            scripts/android-metadata-workflow.test.mjs

  play-readonly:
    if: >-
      github.event_name == 'workflow_dispatch' &&
      (inputs.mode == 'backup' || inputs.mode == 'diff' || inputs.mode == 'readback')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: validate-metadata
    env:
      DOPPLER_PROJECT: ${{ vars.DOPPLER_PROJECT }}
      DOPPLER_CONFIG: ${{ vars.DOPPLER_CONFIG }}
      PLAY_PACKAGE_NAME: ${{ vars.PACKAGE_NAME }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Install pinned Doppler CLI
        if: inputs.mode == 'backup' || inputs.mode == 'readback'
        env:
          DOPPLER_VERSION: 3.76.1
          DOPPLER_SHA256: e35230bd21fdbd7e41ddcb24672ec61cecefdb22de244d0216ea6b59853f63f2
        run: |
          set -euo pipefail
          archive="doppler_${DOPPLER_VERSION}_linux_amd64.tar.gz"
          url="https://github.com/DopplerHQ/cli/releases/download/${DOPPLER_VERSION}/${archive}"
          curl --fail --location --silent --show-error "$url" -o "$RUNNER_TEMP/$archive"
          echo "$DOPPLER_SHA256  $RUNNER_TEMP/$archive" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" doppler
          sudo install -m 0755 "$RUNNER_TEMP/doppler" /usr/local/bin/doppler
          doppler --version
      - name: Download Doppler secrets
        if: inputs.mode == 'backup' || inputs.mode == 'readback'
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
        run: |
          if [ -n "$DOPPLER_TOKEN" ]; then
            doppler secrets download \
              --project "${DOPPLER_PROJECT:-mobil-apps}" \
              --config "${DOPPLER_CONFIG:-astrology}" \
              --format json \
              --no-file \
              > "$RUNNER_TEMP/doppler-secrets.json"
            chmod 600 "$RUNNER_TEMP/doppler-secrets.json"
          else
            echo "DOPPLER_TOKEN is not set; relying on GitHub environment secrets."
          fi
      - name: Write Play service account credentials
        if: inputs.mode == 'backup' || inputs.mode == 'readback'
        env:
          DOPPLER_SECRETS_JSON_PATH: ${{ runner.temp }}/doppler-secrets.json
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: |
          umask 077
          node -e "const fs=require('fs'); const p=process.env.DOPPLER_SECRETS_JSON_PATH; let s=''; if (p && fs.existsSync(p)) { const parsed=JSON.parse(fs.readFileSync(p,'utf8')); const pick=(key)=> typeof parsed[key]==='string' ? parsed[key] : parsed[key]?.computed || ''; s = pick('PLAY_SERVICE_ACCOUNT_JSON') || pick('GOOGLE_SERVICE_ACCOUNT_JSON'); } s = process.env.PLAY_SERVICE_ACCOUNT_JSON || process.env.GOOGLE_SERVICE_ACCOUNT_JSON || s; if (!s) { console.error('Missing Play service account JSON from GitHub secrets or Doppler.'); process.exit(1); } fs.writeFileSync(process.env.RUNNER_TEMP + '/play-service-account.json', s, {mode:0o600});"
          chmod 600 "$RUNNER_TEMP/play-service-account.json"
      - name: Create secret-safe Play backup
        if: inputs.mode == 'backup'
        env:
          PLAY_SERVICE_ACCOUNT_JSON_PATH: ${{ runner.temp }}/play-service-account.json
        run: |
          mkdir -p "$RUNNER_TEMP/play-backup"
          chmod 700 "$RUNNER_TEMP/play-backup"
          export PLAY_PACKAGE_NAME="${PLAY_PACKAGE_NAME:-com.parsfilo.astrology}"
          node scripts/backup-play-metadata.mjs \
            --output "$RUNNER_TEMP/play-backup/play-backup.json"
          sha256sum "$RUNNER_TEMP/play-backup/play-backup.json" \
            | tee "$RUNNER_TEMP/play-backup/play-backup.sha256"
      - name: Upload backup artifact
        if: inputs.mode == 'backup'
        uses: actions/upload-artifact@v4
        with:
          name: play-metadata-backup-${{ github.run_id }}
          path: ${{ runner.temp }}/play-backup/
          retention-days: 3
          if-no-files-found: error
      - name: Require prior backup run
        if: inputs.mode == 'diff'
        env:
          BACKUP_RUN_ID: ${{ inputs.backup_run_id }}
        run: test -n "$BACKUP_RUN_ID"
      - name: Download prior backup artifact
        if: inputs.mode == 'diff'
        uses: actions/download-artifact@v4
        with:
          name: play-metadata-backup-${{ inputs.backup_run_id }}
          path: ${{ runner.temp }}/play-input
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.backup_run_id }}
      - name: Produce Play metadata dry-run diff
        if: inputs.mode == 'diff'
        run: |
          chmod 600 "$RUNNER_TEMP/play-input/play-backup.json"
          node scripts/diff-play-metadata.mjs \
            --backup "$RUNNER_TEMP/play-input/play-backup.json" \
            --expected-root "$GITHUB_WORKSPACE"
      - name: Upload dry-run diff artifact
        if: always() && inputs.mode == 'diff'
        uses: actions/upload-artifact@v4
        with:
          name: play-metadata-diff-${{ github.run_id }}
          path: ${{ runner.temp }}/play-input/play-backup.json.diff.json
          retention-days: 3
          if-no-files-found: warn
      - name: Independent Play read-back
        if: inputs.mode == 'readback'
        env:
          PLAY_SERVICE_ACCOUNT_JSON_PATH: ${{ runner.temp }}/play-service-account.json
        run: |
          export PLAY_PACKAGE_NAME="${PLAY_PACKAGE_NAME:-com.parsfilo.astrology}"
          node scripts/readback-play-metadata.mjs \
            --expected-root "$GITHUB_WORKSPACE"
      - name: Summarize read-only operation
        if: always()
        env:
          MODE: ${{ inputs.mode }}
        run: |
          {
            echo "## Play metadata read-only operation"
            echo "- Mode: $MODE"
            echo "- No listing, track, subscription, or policy mutation is performed by this job."
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Remove temporary credentials
        if: always()
        run: |
          rm -f \
            "$RUNNER_TEMP/play-service-account.json" \
            "$RUNNER_TEMP/doppler-secrets.json"

  reject-invalid-mutation:
    if: >-
      github.event_name == 'workflow_dispatch' &&
      (inputs.mode == 'publish' || inputs.mode == 'cleanup' || inputs.mode == 'restore') &&
      (github.ref != 'refs/heads/main' ||
       github.repository != 'MakerParsDev/Astroloji')
    runs-on: ubuntu-latest
    steps:
      - name: Reject unsafe metadata mutation request
        run: |
          echo "Metadata mutation requires main and MakerParsDev/Astroloji. Run-scoped authorization is validated separately." >&2
          exit 1

  authorize-mutation:
    if: >-
      github.event_name == 'workflow_dispatch' &&
      (inputs.mode == 'publish' || inputs.mode == 'cleanup' || inputs.mode == 'restore') &&
      github.ref == 'refs/heads/main' &&
      github.repository == 'MakerParsDev/Astroloji' &&
      vars.ENABLE_METADATA_PUBLISH == 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: validate-metadata
    permissions:
      contents: read
      actions: read
      statuses: read
    env:
      GH_TOKEN: ${{ github.token }}
      AUTHORIZATION_CORRELATION: ${{ inputs.authorization_correlation }}
      MODE: ${{ inputs.mode }}
    steps:
      - name: Validate immutable dispatch correlation and current run metadata
        run: |
          set -euo pipefail
          if [[ ! "$AUTHORIZATION_CORRELATION" =~ ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-5][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}$ ]]; then
            echo "authorization_correlation must be a UUID." >&2
            exit 1
          fi
          run_json="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID")"
          test "$(jq -r '.event' <<<"$run_json")" = "workflow_dispatch"
          test "$(jq -r '.head_branch' <<<"$run_json")" = "main"
          test "$(jq -r '.head_sha' <<<"$run_json")" = "$GITHUB_SHA"
          test "$(jq -r '.actor.login' <<<"$run_json")" = "MakerParsDev"
          expected_title="android-metadata-${MODE}-${AUTHORIZATION_CORRELATION}"
          test "$(jq -r '.display_title' <<<"$run_json")" = "$expected_title"
      - name: Wait for exact expiring commit-status authorization
        run: |
          set -euo pipefail
          context="metadata-auth/$AUTHORIZATION_CORRELATION"
          expected_target="https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          deadline="$(( $(date +%s) + 180 ))"
          while :; do
            now="$(date +%s)"
            status_pages="$(gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/statuses?per_page=100")"
            status_json="$(jq -c --arg context "$context" '[.[][] | select(.context == $context)] | sort_by(.updated_at) | last // empty' <<<"$status_pages")"
            if [ -n "$status_json" ]; then
              state="$(jq -r '.state' <<<"$status_json")"
              description="$(jq -r '.description // ""' <<<"$status_json")"
              creator="$(jq -r '.creator.login // ""' <<<"$status_json")"
              target_url="$(jq -r '.target_url // ""' <<<"$status_json")"
              if [ "$state" = "success" ] && [ "$creator" = "MakerParsDev" ] && [ "$target_url" = "$expected_target" ] && [[ "$description" =~ ^authorized\ run=([0-9]+)\;exp=([0-9]+)$ ]]; then
                authorized_run="${BASH_REMATCH[1]}"
                expires_at="${BASH_REMATCH[2]}"
                remaining="$(( expires_at - now ))"
                if [ "$authorized_run" = "$GITHUB_RUN_ID" ] && [ "$remaining" -gt 0 ] && [ "$remaining" -le 300 ]; then
                  echo "Exact commit-status authorization accepted with bounded expiry."
                  break
                fi
              fi
            fi

            if [ "$now" -ge "$deadline" ]; then
              echo "Timed out waiting for exact commit-status metadata authorization." >&2
              exit 1
            fi
            sleep 5
          done
      - name: Record bounded authorization
        run: |
          {
            echo "## Metadata mutation authorization"
            echo "- Authorization context: metadata-auth/<immutable-correlation>"
            echo "- Authorization scope: exact workflow run ID and exact main SHA"
            echo "- Expected authorization description: authorized run=<exact-run-id>;exp=<epoch>"
            echo "- Maximum accepted lifetime: 300 seconds"
            echo "- Authorization creator: MakerParsDev"
            echo "- Legacy ENABLE_METADATA_PUBLISH gate remained false"
          } >> "$GITHUB_STEP_SUMMARY"

  play-mutation:
    if: >-
      github.event_name == 'workflow_dispatch' &&
      (inputs.mode == 'publish' || inputs.mode == 'cleanup' || inputs.mode == 'restore') &&
      github.ref == 'refs/heads/main' &&
      github.repository == 'MakerParsDev/Astroloji' &&
      vars.ENABLE_METADATA_PUBLISH == 'false' &&
      needs.authorize-mutation.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: production
    needs:
      - validate-metadata
      - authorize-mutation
    env:
      DOPPLER_PROJECT: ${{ vars.DOPPLER_PROJECT }}
      DOPPLER_CONFIG: ${{ vars.DOPPLER_CONFIG }}
      PLAY_PACKAGE_NAME: ${{ vars.PACKAGE_NAME }}
      PLAY_METADATA_TRACK: ${{ inputs.track }}
      MODE: ${{ inputs.mode }}
      BACKUP_RUN_ID: ${{ inputs.backup_run_id }}
      BACKUP_SHA256: ${{ inputs.backup_sha256 }}
      CONFIRMATION: ${{ inputs.confirmation }}
      STATE_DIGEST: ${{ inputs.state_digest }}
      REMOVAL_COUNT: ${{ inputs.removal_count }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Require immutable backup inputs
        run: |
          test -n "$BACKUP_RUN_ID"
          test -n "$BACKUP_SHA256"
          test -n "$CONFIRMATION"
      - name: Download approved backup artifact
        uses: actions/download-artifact@v4
        with:
          name: play-metadata-backup-${{ inputs.backup_run_id }}
          path: ${{ runner.temp }}/play-input
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.backup_run_id }}
      - name: Verify approved backup SHA-256
        run: |
          chmod 600 "$RUNNER_TEMP/play-input/play-backup.json"
          actual_sha="$(sha256sum "$RUNNER_TEMP/play-input/play-backup.json" | awk '{print $1}')"
          test "$actual_sha" = "$BACKUP_SHA256"
      - name: Re-run dry-run diff before mutation
        if: inputs.mode == 'publish'
        run: |
          node scripts/diff-play-metadata.mjs \
            --backup "$RUNNER_TEMP/play-input/play-backup.json" \
            --expected-root "$GITHUB_WORKSPACE"
      - name: Install pinned Doppler CLI
        env:
          DOPPLER_VERSION: 3.76.1
          DOPPLER_SHA256: e35230bd21fdbd7e41ddcb24672ec61cecefdb22de244d0216ea6b59853f63f2
        run: |
          set -euo pipefail
          archive="doppler_${DOPPLER_VERSION}_linux_amd64.tar.gz"
          url="https://github.com/DopplerHQ/cli/releases/download/${DOPPLER_VERSION}/${archive}"
          curl --fail --location --silent --show-error "$url" -o "$RUNNER_TEMP/$archive"
          echo "$DOPPLER_SHA256  $RUNNER_TEMP/$archive" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" doppler
          sudo install -m 0755 "$RUNNER_TEMP/doppler" /usr/local/bin/doppler
          doppler --version
      - name: Download Doppler secrets
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
        run: |
          if [ -n "$DOPPLER_TOKEN" ]; then
            doppler secrets download \
              --project "${DOPPLER_PROJECT:-mobil-apps}" \
              --config "${DOPPLER_CONFIG:-astrology}" \
              --format json \
              --no-file \
              > "$RUNNER_TEMP/doppler-secrets.json"
            chmod 600 "$RUNNER_TEMP/doppler-secrets.json"
          else
            echo "DOPPLER_TOKEN is not set; relying on GitHub environment secrets."
          fi
      - name: Write Play service account credentials
        env:
          DOPPLER_SECRETS_JSON_PATH: ${{ runner.temp }}/doppler-secrets.json
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: |
          umask 077
          node -e "const fs=require('fs'); const p=process.env.DOPPLER_SECRETS_JSON_PATH; let s=''; if (p && fs.existsSync(p)) { const parsed=JSON.parse(fs.readFileSync(p,'utf8')); const pick=(key)=> typeof parsed[key]==='string' ? parsed[key] : parsed[key]?.computed || ''; s = pick('PLAY_SERVICE_ACCOUNT_JSON') || pick('GOOGLE_SERVICE_ACCOUNT_JSON'); } s = process.env.PLAY_SERVICE_ACCOUNT_JSON || process.env.GOOGLE_SERVICE_ACCOUNT_JSON || s; if (!s) { console.error('Missing Play service account JSON from GitHub secrets or Doppler.'); process.exit(1); } fs.writeFileSync(process.env.RUNNER_TEMP + '/play-service-account.json', s, {mode:0o600});"
          chmod 600 "$RUNNER_TEMP/play-service-account.json"
      - name: Verify approved backup still matches live Play state
        if: inputs.mode == 'publish'
        env:
          PLAY_SERVICE_ACCOUNT_JSON_PATH: ${{ runner.temp }}/play-service-account.json
        run: |
          export PLAY_PACKAGE_NAME="${PLAY_PACKAGE_NAME:-com.parsfilo.astrology}"
          node scripts/verify-play-backup-current.mjs \
            --backup "$RUNNER_TEMP/play-input/play-backup.json"
      - name: Publish Turkish and English text and images
        if: inputs.mode == 'publish'
        env:
          PLAY_SERVICE_ACCOUNT_JSON_PATH: ${{ runner.temp }}/play-service-account.json
        run: |
          export PLAY_PACKAGE_NAME="${PLAY_PACKAGE_NAME:-com.parsfilo.astrology}"
          node scripts/publish-play-metadata.mjs \
            --backup "$RUNNER_TEMP/play-input/play-backup.json" \
            --confirmation "$CONFIRMATION"
      - name: Remove unsupported live locales
        if: inputs.mode == 'cleanup'
        env:
          PLAY_SERVICE_ACCOUNT_JSON_PATH: ${{ runner.temp }}/play-service-account.json
        run: |
          test -n "$STATE_DIGEST"
          test -n "$REMOVAL_COUNT"
          export PLAY_PACKAGE_NAME="${PLAY_PACKAGE_NAME:-com.parsfilo.astrology}"
          node scripts/cleanup-play-locales.mjs \
            --backup "$RUNNER_TEMP/play-input/play-backup.json" \
            --backup-sha256 "$BACKUP_SHA256" \
            --state-digest "$STATE_DIGEST" \
            --removal-count "$REMOVAL_COUNT" \
            --confirmation "$CONFIRMATION"
      - name: Restore exact backed-up listing state
        if: inputs.mode == 'restore'
        env:
          PLAY_SERVICE_ACCOUNT_JSON_PATH: ${{ runner.temp }}/play-service-account.json
        run: |
          export PLAY_PACKAGE_NAME="${PLAY_PACKAGE_NAME:-com.parsfilo.astrology}"
          node scripts/restore-play-metadata.mjs \
            --backup "$RUNNER_TEMP/play-input/play-backup.json" \
            --confirmation "$CONFIRMATION"
      - name: Summarize mutation authorization closure requirement
        if: always()
        run: |
          {
            echo "## Play metadata mutation"
            echo "- Mode: $MODE"
            echo "- Backup run: $BACKUP_RUN_ID"
            echo "- Required operator closure: latest metadata-auth/<correlation> status is closed run=<run-id>"
            echo "- Legacy gate must remain: ENABLE_METADATA_PUBLISH=false"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Remove temporary credentials
        if: always()
        run: |
          rm -f \
            "$RUNNER_TEMP/play-service-account.json" \
            "$RUNNER_TEMP/doppler-secrets.json"

  verify-metadata-authorization-closed:
    if: >-
      always() && github.event_name == 'workflow_dispatch' &&
      (inputs.mode == 'publish' || inputs.mode == 'cleanup' || inputs.mode == 'restore') &&
      (needs.authorize-mutation.result != 'skipped' || needs.play-mutation.result != 'skipped')
    needs:
      - authorize-mutation
      - play-mutation
    runs-on: ubuntu-latest
    permissions:
      contents: read
      statuses: read
    env:
      GH_TOKEN: ${{ github.token }}
      AUTHORIZATION_CORRELATION: ${{ inputs.authorization_correlation }}
      LEGACY_GATE: ${{ vars.ENABLE_METADATA_PUBLISH }}
    steps:
      - name: Verify commit-status authorization returned to closed state
        run: |
          set -euo pipefail
          if [ "$(printf '%s' "$LEGACY_GATE" | tr '[:upper:]' '[:lower:]')" != "false" ]; then
            echo "ENABLE_METADATA_PUBLISH=false is required after metadata operations." >&2
            exit 1
          fi
          context="metadata-auth/$AUTHORIZATION_CORRELATION"
          expected_target="https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          status_pages="$(gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/statuses?per_page=100")"
          status_json="$(jq -c --arg context "$context" '[.[][] | select(.context == $context)] | sort_by(.updated_at) | last // empty' <<<"$status_pages")"
          if [ -z "$status_json" ]; then
            echo "Missing closed metadata authorization status for $context." >&2
            exit 1
          fi
          state="$(jq -r '.state' <<<"$status_json")"
          description="$(jq -r '.description // ""' <<<"$status_json")"
          creator="$(jq -r '.creator.login // ""' <<<"$status_json")"
          target_url="$(jq -r '.target_url // ""' <<<"$status_json")"
          test "$state" = "success"
          test "$description" = "closed run=$GITHUB_RUN_ID"
          test "$creator" = "MakerParsDev"
          test "$target_url" = "$expected_target"
      - name: Record authorization closure
        if: always()
        run: |
          {
            echo "## Metadata mutation authorization closure"
            echo "- Commit-status context: metadata-auth/<immutable-correlation>"
            echo "- Required latest state: closed run=<exact-run-id>"
            echo "- Authorization creator: MakerParsDev"
            echo "- ENABLE_METADATA_PUBLISH=false"
            echo "- Independent commit-status read-back executed after the mutation flow."
          } >> "$GITHUB_STEP_SUMMARY"
