name: opencode-model-canary

on:
  schedule:
    - cron: "35 4 * * *"
  workflow_dispatch:

concurrency:
  group: opencode-model-canary
  cancel-in-progress: true

jobs:
  canary:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24

      - name: Install checksum-pinned OpenCode CLI
        shell: bash
        run: bash scripts/install-opencode-ci.sh

      - name: Select a currently free coding model
        id: free_model
        run: node scripts/select-opencode-free-model.mjs

      - name: Validate project configuration
        run: opencode debug config > /dev/null

      - name: Verify anonymous free-model inference
        env:
          MODEL: ${{ steps.free_model.outputs.model }}
        shell: bash
        run: |
          output="$(
            timeout 120s opencode run --pure --auto --model "$MODEL"               "Reply exactly FREE_MODEL_CANARY_OK. Do not call tools."
          )"
          printf '%s' "$output" | grep -F "FREE_MODEL_CANARY_OK"
