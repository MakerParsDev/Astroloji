name: backend-play-webhook-smoke

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-play-webhook-smoke
  cancel-in-progress: false

jobs:
  smoke:
    if: github.repository == 'MakerParsDev/Astroloji'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    env:
      BACKEND_BASE_URL: https://astrology.parsfilo.com
    steps:
      - name: Validate production configuration
        shell: bash
        run: test -n "$BACKEND_BASE_URL"

      - name: Verify Play RTDN OIDC-only negative boundary
        shell: bash
        run: |
          webhook_url="${BACKEND_BASE_URL%/}/api/v1/webhooks/play-rtdn"
          unauthorized_status="$(curl --silent --show-error --output "$RUNNER_TEMP/play-webhook-unauthorized.json" --write-out '%{http_code}' --request POST --header 'content-type: application/json' --data '{}' "$webhook_url")"
          query_token_status="$(curl --silent --show-error --output "$RUNNER_TEMP/play-webhook-query.json" --write-out '%{http_code}' --request POST --header 'content-type: application/json' --data '{}' "${webhook_url}?token=legacy-disabled")"
          header_secret_status="$(curl --silent --show-error --output "$RUNNER_TEMP/play-webhook-header.json" --write-out '%{http_code}' --request POST --header 'content-type: application/json' --header 'X-Play-Secret: legacy-disabled' --data '{}' "$webhook_url")"

          test "$unauthorized_status" = "403"
          test "$query_token_status" = "403"
          test "$header_secret_status" = "403"
          for response in \
            "$RUNNER_TEMP/play-webhook-unauthorized.json" \
            "$RUNNER_TEMP/play-webhook-query.json" \
            "$RUNNER_TEMP/play-webhook-header.json"; do
            jq -e '.error.code == "FORBIDDEN"' "$response" >/dev/null
          done
          echo "Play RTDN OIDC-only boundary verified: missing=403 query=403 header=403."

      - name: Publish smoke summary
        shell: bash
        run: |
          {
            echo '## Play RTDN production smoke'
            echo
            echo '- Missing authentication: rejected'
            echo '- Legacy query authentication: rejected'
            echo '- Legacy header authentication: rejected'
          } >> "$GITHUB_STEP_SUMMARY"
