name: content-backfill

on:
  schedule:
    - cron: "15 1 * * *"
  workflow_dispatch:
    inputs:
      seed_date:
        description: "Optional base date in YYYY-MM-DD format. Leave empty to start from today."
        required: false
        type: string
      daily_days:
        description: "Number of future daily documents to upload."
        required: false
        default: "14"
        type: string
      skip_static_content:
        description: "Skip personality and compatibility uploads."
        required: false
        default: true
        type: boolean

concurrency:
  group: content-backfill
  cancel-in-progress: false

jobs:
  backfill:
    if: github.event_name == 'workflow_dispatch' || vars.ENABLE_CONTENT_BACKFILL == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production-admin-content
    permissions:
      contents: read
    env:
      ADMIN_CONTENT_SECRET: ${{ secrets.ADMIN_CONTENT_SECRET }}
      BACKEND_BASE_URL: https://astrology.parsfilo.com
      SEED_DATE: ${{ github.event.inputs.seed_date || '' }}
      SEED_DAILY_DAYS: ${{ github.event.inputs.daily_days || '14' }}
      SEED_SKIP_STATIC_CONTENT: ${{ github.event.inputs.skip_static_content || 'true' }}
      SEED_APPROVED_BY: github:${{ github.actor }}
      SEED_APPROVAL_REFERENCE: github-run:${{ github.run_id }}
    steps:
      - uses: actions/checkout@v6

      - name: Validate content admin secret
        run: |
          if [ -z "$ADMIN_CONTENT_SECRET" ]; then
            echo "ADMIN_CONTENT_SECRET is required for content backfill."
            exit 1
          fi
          echo "::add-mask::$ADMIN_CONTENT_SECRET"

      - name: Trigger content backfill
        run: |
          payload="$(
            python -c "import json, os; payload = {'daily_days': int(os.environ['SEED_DAILY_DAYS']), 'skip_static_content': os.environ['SEED_SKIP_STATIC_CONTENT'].strip().lower() in {'1', 'true'}, 'editorial_status': 'approved', 'approved_by': os.environ['SEED_APPROVED_BY'], 'approval_reference': os.environ['SEED_APPROVAL_REFERENCE']}; seed_date = os.environ.get('SEED_DATE', '').strip(); payload.update({'seed_date': seed_date} if seed_date else {}); print(json.dumps(payload))"
          )"

          curl --fail-with-body --silent --show-error \
            --request POST \
            --url "${BACKEND_BASE_URL%/}/api/v1/admin/content/backfill" \
            --header "content-type: application/json" \
            --header "x-admin-secret: $ADMIN_CONTENT_SECRET" \
            --data "$payload"
