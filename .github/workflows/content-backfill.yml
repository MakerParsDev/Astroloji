name: content-backfill

on:
  schedule:
    - cron: "15 1 * * *"
  workflow_dispatch:
    inputs:
      seed_date:
        description: "Optional base date in YYYY-MM-DD format. Leave empty to start from today."
        required: false
        type: string
      daily_days:
        description: "Days to generate for each selected locale (1-7); AI disabled."
        required: false
        default: "7"
        type: string
      language:
        description: "Supported locale, or all to cover the six product locales."
        required: false
        default: "all"
        type: choice
        options: [all, tr, en, es, pt, de, fr]

concurrency:
  group: content-backfill
  cancel-in-progress: false

jobs:
  backfill:
    # Product-owned deterministic daily content; separate from agent automation.
    # Enable only after successful guarded backend deploy and live R2 acceptance.
    if: >-
      github.repository == 'MakerParsDev/Astroloji' &&
      (github.event_name == 'workflow_dispatch' || github.event_name == 'schedule')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production-admin-content
    permissions:
      contents: read
      issues: write
    env:
      ADMIN_CONTENT_SECRET: ${{ secrets.ADMIN_CONTENT_SECRET }}
      BACKEND_BASE_URL: https://astrology.parsfilo.com
      SEED_DATE: ${{ github.event.inputs.seed_date || '' }}
      SEED_DAILY_DAYS: ${{ github.event.inputs.daily_days || '7' }}
      SEED_LANGUAGE: ${{ github.event.inputs.language || 'all' }}
      SEED_APPROVED_BY: github:${{ github.actor }}
      SEED_APPROVAL_REFERENCE: github-run:${{ github.run_id }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: main
          persist-credentials: false

      - name: Validate content admin secret
        run: |
          if [ -z "$ADMIN_CONTENT_SECRET" ]; then
            echo "ADMIN_CONTENT_SECRET is required for content backfill."
            exit 1
          fi
          echo "::add-mask::$ADMIN_CONTENT_SECRET"

      - name: Verify backend has deterministic and idempotent backfill support
        run: |
          # Fail closed before any R2 write. Old Workers ignore unknown flags.
          capabilities="$(
            curl --fail-with-body --silent --show-error \
              --request GET \
              --url "$BACKEND_BASE_URL/api/v1/admin/content/backfill/capabilities" \
              --header "x-admin-secret: $ADMIN_CONTENT_SECRET"
          )"
          printf '%s' "$capabilities" | python -c "import json,sys; c=json.load(sys.stdin); assert c.get('deterministic_default') is True and c.get('skip_existing_supported') is True and c.get('max_product_horizon_days') == 7, 'Backend backfill capabilities are incompatible'"

      - name: Recover bounded product content without metered AI
        run: |
          # One request per locale keeps R2/KV subrequests bounded.
          if ! [[ "$SEED_DAILY_DAYS" =~ ^[1-7]$ ]]; then
            echo "Daily horizon must be an integer from 1 through 7."
            exit 1
          fi
          case "$SEED_LANGUAGE" in
            all) languages="tr en es pt de fr" ;;
            tr|en|es|pt|de|fr) languages="$SEED_LANGUAGE" ;;
            *) echo "Unsupported locale"; exit 1 ;;
          esac

          for locale in $languages; do
            payload="$(
              SEED_CURRENT_LOCALE="$locale" python -c "import json, os; payload = {'daily_days': int(os.environ['SEED_DAILY_DAYS']), 'language': os.environ['SEED_CURRENT_LOCALE'], 'skip_static_content': True, 'skip_existing': True, 'enhance_with_ai': False, 'editorial_status': 'approved', 'approved_by': os.environ['SEED_APPROVED_BY'], 'approval_reference': os.environ['SEED_APPROVAL_REFERENCE']}; seed_date = os.environ.get('SEED_DATE', '').strip(); payload.update({'seed_date': seed_date} if seed_date else {}); print(json.dumps(payload))"
            )"
            echo "Backfilling locale: $locale (deterministic, 7-day maximum)"
            curl --fail-with-body --silent --show-error \
              --request POST \
              --url "$BACKEND_BASE_URL/api/v1/admin/content/backfill" \
              --header "content-type: application/json" \
              --header "x-admin-secret: $ADMIN_CONTENT_SECRET" \
              --data "$payload"
            echo
          done


      - name: Open or update incident on content backfill failure
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          title="Scheduled horoscope content backfill failed"
          body="Scheduled content generation/backfill failed closed. Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          existing="$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "$title in:title" --json number --jq '.[0].number // empty')"
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --repo "$GITHUB_REPOSITORY" --body "$body"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --body "$body"
          fi
