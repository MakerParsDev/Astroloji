name: android-production-release

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: Release version name
        required: true
        type: string
      version_code:
        description: Monotonic Play version code
        required: true
        type: string
      release_name:
        description: Human-readable Play release name
        required: true
        type: string
      rollout_fraction:
        description: Staged rollout fraction between 0 and 1
        required: false
        default: '0.1'
        type: string
      promote_from_track:
        description: Existing track to promote from instead of publishing a new bundle
        required: false
        default: ''
        type: string
      release_sha:
        description: Optional exact main SHA. Defaults to the dispatched main commit.
        required: false
        default: ''
        type: string

permissions:
  contents: read

concurrency:
  group: android-production-release
  cancel-in-progress: false

jobs:
  publish-production:
    if: >-
      github.repository == 'MakerParsDev/Astroloji' &&
      vars.ENABLE_PRODUCTION_RELEASE == 'true' &&
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: production
    outputs:
      release_name: ${{ steps.release_identity.outputs.release_name }}
    defaults:
      run:
        working-directory: Astroloji
        shell: bash
    env:
      PACKAGE_NAME: ${{ vars.PACKAGE_NAME }}
      PLAY_TRACK_PRODUCTION: ${{ vars.PLAY_TRACK_PRODUCTION }}
      JAVA_VERSION: ${{ vars.JAVA_VERSION }}
      DOPPLER_PROJECT: ${{ vars.DOPPLER_PROJECT }}
      DOPPLER_CONFIG: ${{ vars.DOPPLER_CONFIG }}
      BACKEND_BASE_URL: https://astrology.parsfilo.com
      RELEASE_SHA: ${{ inputs.release_sha || github.sha }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ env.RELEASE_SHA }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify immutable main release SHA
        run: |
          test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
          git fetch --no-tags --no-recurse-submodules origin main
          test "$(git rev-parse origin/main)" = "$RELEASE_SHA"

      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24


      - name: Verify live rewarded SSV backend
        run: node ../scripts/check-backend-reward-ssv.mjs

      - name: Resolve production release name
        id: release_identity
        env:
          REQUESTED_RELEASE_NAME: ${{ inputs.release_name }}
          VERSION_CODE: ${{ inputs.version_code }}
        run: |
          if [ -n "$REQUESTED_RELEASE_NAME" ]; then
            release_name="$REQUESTED_RELEASE_NAME"
          else
            echo "release_name is required for a manual production release." >&2
            exit 1
          fi
          case "$release_name" in
            *[!0-9A-Za-z._-]*|'')
              echo "Release name contains unsupported characters." >&2
              exit 1
              ;;
          esac
          printf 'release_name=%s\n' "$release_name" >> "$GITHUB_OUTPUT"

      - name: Validate manual production release inputs
        env:
          REQUESTED_VERSION_CODE: ${{ inputs.version_code }}
          REQUESTED_VERSION_NAME: ${{ inputs.version_name }}
          REQUESTED_SOURCE_TRACK: ${{ inputs.promote_from_track }}
          REQUESTED_ROLLOUT_FRACTION: ${{ inputs.rollout_fraction }}
        run: |
          node --input-type=module <<'NODE'
          import { assertRequestedVersionCode } from '../scripts/check-play-release-access.mjs';

          const code = process.env.REQUESTED_VERSION_CODE ?? '';
          const name = process.env.REQUESTED_VERSION_NAME ?? '';
          const source = process.env.REQUESTED_SOURCE_TRACK ?? '';
          const fraction = process.env.REQUESTED_ROLLOUT_FRACTION ?? '';
          const target = process.env.PLAY_TRACK_PRODUCTION ?? '';
          if (target !== 'production') {
            throw new Error('Production release must explicitly target the production Play track.');
          }

          if (!/^[1-9][0-9]*$/.test(code)) {
            throw new Error('Version code must be a positive decimal integer.');
          }
          assertRequestedVersionCode(code, 1);
          if (!/^[0-9A-Za-z._-]{1,50}$/.test(name)) {
            throw new Error('Version name contains unsupported characters.');
          }
          if (!/^0\.[0-9]+$/.test(fraction) || Number(fraction) <= 0 || Number(fraction) >= 1) {
            throw new Error('Rollout fraction must be a decimal between zero and one.');
          }
          if (source && (!/^[A-Za-z][A-Za-z0-9_-]{0,99}$/.test(source) || source.toLowerCase() === target.toLowerCase())) {
            throw new Error('Source track must be a valid non-production Play track name.');
          }
          NODE

      - name: Install pinned Doppler CLI
        env:
          DOPPLER_VERSION: 3.76.1
          DOPPLER_SHA256: e35230bd21fdbd7e41ddcb24672ec61cecefdb22de244d0216ea6b59853f63f2
        run: |
          set -euo pipefail
          archive="doppler_${DOPPLER_VERSION}_linux_amd64.tar.gz"
          url="https://github.com/DopplerHQ/cli/releases/download/${DOPPLER_VERSION}/${archive}"
          curl --fail --silent --show-error --location \
            --proto '=https' --proto-redir '=https' \
            "$url" --output "$RUNNER_TEMP/$archive"
          echo "$DOPPLER_SHA256  $RUNNER_TEMP/$archive" | sha256sum --check
          mkdir -p "$RUNNER_TEMP/doppler-bin"
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP/doppler-bin" doppler
          chmod 0755 "$RUNNER_TEMP/doppler-bin/doppler"
          echo "$RUNNER_TEMP/doppler-bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/doppler-bin/doppler" --version

      - name: Download Doppler secrets
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
        run: |
          if [ -n "$DOPPLER_TOKEN" ]; then
            doppler secrets download \
              --project "${DOPPLER_PROJECT:-mobil-apps}" \
              --config "${DOPPLER_CONFIG:-astrology}" \
              --format json \
              --no-file \
              > "$RUNNER_TEMP/doppler-secrets.json"
            chmod 600 "$RUNNER_TEMP/doppler-secrets.json"
          else
            echo "DOPPLER_TOKEN is not set; relying on GitHub environment secrets."
          fi

      - name: Prepare Play and signing assets
        env:
          DOPPLER_SECRETS_JSON_PATH: ${{ runner.temp }}/doppler-secrets.json
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          PLAY_TRACK: ${{ vars.PLAY_TRACK_PRODUCTION }}
          PLAY_RELEASE_STATUS: IN_PROGRESS
          PLAY_RELEASE_NAME: ${{ steps.release_identity.outputs.release_name }}
          PLAY_USER_FRACTION: ${{ inputs.rollout_fraction }}
          VERSION_CODE: ${{ inputs.version_code }}
          VERSION_NAME: ${{ inputs.version_name }}
          CRASHLYTICS_MAPPING_UPLOAD_ENABLED: true
          REQUIRE_ANDROID_SIGNING: ${{ inputs.promote_from_track == '' && 'true' || 'false' }}
          REQUIRE_GOOGLE_SERVICES_JSON: true
          REQUIRE_PLAY_SERVICE_ACCOUNT_JSON: true
        run: node ../scripts/prepare-android-release-assets.mjs

      - name: Verify production AdMob IDs for new bundle
        if: ${{ inputs.promote_from_track == '' }}
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';

          const values = new Map();
          for (const line of fs.readFileSync('gradle.properties', 'utf8').split(/\r?\n/)) {
            const separator = line.indexOf('=');
            if (separator < 1) continue;
            const key = line.slice(0, separator);
            if (values.has(key)) throw new Error(`Duplicate release property: ${key}`);
            values.set(key, line.slice(separator + 1).trim());
          }

          const appKey = 'ADMOB_APP_ID';
          const unitKeys = [
            'ADMOB_BANNER_ID', 'ADMOB_INTERSTITIAL_ID',
            'ADMOB_REWARDED_ID', 'ADMOB_REWARDED_INTERSTITIAL_ID',
            'ADMOB_APP_OPEN_ID', 'ADMOB_NATIVE_ADVANCED_ID',
          ];
          for (const key of [appKey, ...unitKeys]) {
            const id = values.get(key) ?? '';
            const valid = key === appKey
              ? /^ca-app-pub-\d+~\d+$/.test(id)
              : /^ca-app-pub-\d+\/\d+$/.test(id);
            if (!valid || id.includes('3940256099942544')) {
              throw new Error(`Release requires a non-sample production AdMob ID for ${key}.`);
            }
          }
          NODE

      - name: Verify Google Play version code for new bundle
        if: ${{ inputs.promote_from_track == '' }}
        id: play_access
        env:
          PLAY_PACKAGE_NAME: ${{ env.PACKAGE_NAME }}
          PLAY_SERVICE_ACCOUNT_JSON_PATH: ${{ runner.temp }}/play-service-account.json
        run: node ../scripts/check-play-release-access.mjs

      - name: Ensure new bundle has an unused Play version code
        if: ${{ inputs.promote_from_track == '' }}
        env:
          REQUESTED_VERSION_CODE: ${{ inputs.version_code }}
          REQUIRED_VERSION_CODE: ${{ steps.play_access.outputs.recommended_version_code }}
        run: |
          node --input-type=module <<'NODE'
          import { assertRequestedVersionCode } from '../scripts/check-play-release-access.mjs';
          assertRequestedVersionCode(
            process.env.REQUESTED_VERSION_CODE,
            process.env.REQUIRED_VERSION_CODE,
          );
          NODE

      - name: Ensure Gradle wrapper is executable
        run: chmod +x ./gradlew

      - name: Build signed release bundle
        if: ${{ inputs.promote_from_track == '' }}
        run: ./gradlew :app:bundleRelease

      - name: Reverify current main immediately before production mutation
        run: |
          git fetch --no-tags --no-recurse-submodules origin main
          test "$(git rev-parse origin/main)" = "$RELEASE_SHA"

      - name: Publish new production rollout
        if: ${{ inputs.promote_from_track == '' }}
        run: ./gradlew :app:publishReleaseBundle

      - name: Promote from an existing Play track
        if: ${{ inputs.promote_from_track != '' }}
        env:
          PROMOTE_FROM_TRACK: ${{ inputs.promote_from_track }}
          PLAY_USER_FRACTION: ${{ inputs.rollout_fraction }}
          VERSION_CODE: ${{ inputs.version_code }}
          RELEASE_NAME: ${{ steps.release_identity.outputs.release_name }}
        run: >-
          ./gradlew :app:promoteReleaseArtifact
          --from-track="$PROMOTE_FROM_TRACK"
          --promote-track="${PLAY_TRACK_PRODUCTION:-production}"
          --release-name="$RELEASE_NAME"
          --release-status="inProgress"
          --user-fraction="$PLAY_USER_FRACTION"
          --version-code="$VERSION_CODE"

      - name: Upload Android production artifacts
        if: ${{ inputs.promote_from_track == '' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: android-production-release-${{ inputs.version_code }}
          path: |
            Astroloji/app/build/outputs/bundle/release/*.aab
            Astroloji/app/build/outputs/mapping/release/mapping.txt
          if-no-files-found: error

      - name: Publish summary
        env:
          VERSION_NAME: ${{ inputs.version_name }}
          VERSION_CODE: ${{ inputs.version_code }}
          PROMOTE_FROM_TRACK: ${{ inputs.promote_from_track }}
          PLAY_USER_FRACTION: ${{ inputs.rollout_fraction }}
          RELEASE_NAME: ${{ steps.release_identity.outputs.release_name }}
        run: |
          {
            echo '## Android production release'
            echo
            echo "- Version name: $VERSION_NAME"
            echo "- Version code: $VERSION_CODE"
            echo "- Release name: $RELEASE_NAME"
            echo "- Git SHA: $RELEASE_SHA"
            echo "- Promote from track: ${PROMOTE_FROM_TRACK:-n/a}"
            echo "- Play track: ${PLAY_TRACK_PRODUCTION:-production}"
            echo "- Release status: inProgress"
            echo "- Rollout fraction: $PLAY_USER_FRACTION"
            if [ -z "$PROMOTE_FROM_TRACK" ]; then
              echo "- Artifact: android-production-release-$VERSION_CODE"
            fi
          } >> "$GITHUB_STEP_SUMMARY"


      - name: Remove sensitive release files
        if: always()
        run: |
          rm -f \
            app/google-services.json \
            gradle.properties \
            "$RUNNER_TEMP/doppler-secrets.json" \
            "$RUNNER_TEMP/play-service-account.json" \
            "$RUNNER_TEMP/upload-keystore.jks"
