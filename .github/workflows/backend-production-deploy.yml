name: backend-production-deploy

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type DEPLOY to publish the current main commit to Cloudflare production."
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: backend-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: github.repository == 'MakerParsDev/Astroloji' && github.ref == 'refs/heads/main' && inputs.confirm == 'DEPLOY'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    defaults:
      run:
        working-directory: backend
        shell: bash
    env:
      DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
      DOPPLER_PROJECT: ${{ vars.DOPPLER_PROJECT }}
      DOPPLER_CONFIG: ${{ vars.DOPPLER_CONFIG }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      PLAY_RTDN_AUDIENCE: ${{ vars.PLAY_RTDN_AUDIENCE }}
      PLAY_RTDN_SERVICE_ACCOUNT_EMAIL: ${{ vars.PLAY_RTDN_SERVICE_ACCOUNT_EMAIL }}
      ADMIN_PANEL_ACCESS_TEAM_DOMAIN: ${{ vars.ADMIN_PANEL_ACCESS_TEAM_DOMAIN }}
      ADMIN_PANEL_ACCESS_AUD: ${{ vars.ADMIN_PANEL_ACCESS_AUD }}
      BACKEND_BASE_URL: https://astrology.parsfilo.com
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Validate deployment configuration
        run: |
          missing=0
          for name in DOPPLER_TOKEN DOPPLER_PROJECT DOPPLER_CONFIG CLOUDFLARE_ACCOUNT_ID PLAY_RTDN_AUDIENCE PLAY_RTDN_SERVICE_ACCOUNT_EMAIL ADMIN_PANEL_ACCESS_TEAM_DOMAIN ADMIN_PANEL_ACCESS_AUD; do
            if [ -z "${!name:-}" ]; then
              echo "Missing required production setting: $name"
              missing=1
            fi
          done
          exit "$missing"

      - name: Mask Play RTDN runtime configuration
        run: |
          echo "::add-mask::$PLAY_RTDN_AUDIENCE"
          echo "::add-mask::$PLAY_RTDN_SERVICE_ACCOUNT_EMAIL"

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Unit tests
        run: npm test

      - name: Runtime smoke tests
        run: npm run test:runtime

      - name: Install Doppler CLI
        run: curl -Ls https://cli.doppler.com/install.sh | sudo sh

      - name: Load and validate deployment secrets from Doppler
        run: |
          umask 077
          doppler secrets download \
            --no-file \
            --format json \
            --project "$DOPPLER_PROJECT" \
            --config "$DOPPLER_CONFIG" \
            > "$RUNNER_TEMP/doppler-secrets.json"
          node <<'NODE'
          const fs = require('node:fs');
          const secrets = JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP + '/doppler-secrets.json', 'utf8'));
          const value = (name) => {
            const raw = secrets[name];
            return typeof raw === 'string' ? raw : raw?.computed;
          };
          const required = [
            'JWT_SECRET',
            'GOOGLE_SERVICE_ACCOUNT_JSON',
            'FIREBASE_SERVICE_ACCOUNT_JSON',
            'ADMOB_REWARDED_ID',
            'CLOUDFLARE_API_TOKEN',
          ];
          const missing = required.filter((name) => !value(name));
          if (missing.length) throw new Error(`Missing required Doppler secrets: ${missing.join(', ')}`);
          for (const name of ['CLOUDFLARE_API_TOKEN']) {
            const resolved = value(name);
            console.log(`::add-mask::${resolved}`);
            fs.appendFileSync(process.env.GITHUB_ENV, `${name}<<DOPPLER_${name}\n${resolved}\nDOPPLER_${name}\n`);
          }
          console.log(`Validated ${required.length} required Doppler secrets.`);
          NODE


      - name: Apply rewarded SSV D1 migration
        run: npx wrangler d1 execute astrology-db --remote --file=scripts/migrate-reward-ssv.sql

      - name: Reconcile notification target D1 schema
        run: node scripts/reconcile-notification-targets.mjs

      - name: Apply tracked D1 migrations
        run: npx wrangler d1 migrations apply astrology-db --remote

      - name: Verify Play RTDN D1 schema
        run: |
          npx wrangler d1 execute astrology-db --remote \
            --command "PRAGMA table_info(play_rtdn_messages); PRAGMA index_list(play_rtdn_messages); PRAGMA index_info(idx_play_rtdn_messages_received_at); SELECT sql FROM sqlite_master WHERE type = 'table' AND name = 'play_rtdn_messages';" --json \
            > "$RUNNER_TEMP/play-rtdn-schema.json"
          node - <<'NODE'
          const fs = require('node:fs');
          const payload = JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP + '/play-rtdn-schema.json', 'utf8'));
          const resultSets = payload.map((entry) => entry.results ?? []);
          const columns = resultSets.find((rows) => rows.some((row) => Object.hasOwn(row, 'cid'))) ?? [];
          const indexes = resultSets.find((rows) => rows.some((row) => Object.hasOwn(row, 'origin'))) ?? [];
          const indexColumns = resultSets.find((rows) => rows.some((row) => Object.hasOwn(row, 'seqno'))) ?? [];
          const schemaRows = resultSets.find((rows) => rows.some((row) => typeof row.sql === 'string')) ?? [];
          const expectedColumns = [
            ['message_id', 'TEXT', 1, 1],
            ['package_name', 'TEXT', 1, 0],
            ['message_fingerprint', 'TEXT', 1, 0],
            ['notification_type', 'TEXT', 0, 0],
            ['status', 'TEXT', 1, 0],
            ['lease_token', 'TEXT', 1, 0],
            ['lease_expires_at', 'TEXT', 1, 0],
            ['received_at', 'TEXT', 1, 0],
            ['processed_at', 'TEXT', 0, 0],
            ['outcome', 'TEXT', 0, 0],
          ];
          if (columns.length !== expectedColumns.length) throw new Error('Play RTDN schema column count mismatch.');
          for (const [name, type, notnull, pk] of expectedColumns) {
            const row = columns.find((candidate) => candidate.name === name);
            if (!row || row.type !== type || Number(row.notnull) !== notnull || Number(row.pk) !== pk) {
              throw new Error(`Play RTDN schema mismatch for ${name}.`);
            }
          }
          if (!indexes.some((row) => row.name === 'idx_play_rtdn_messages_received_at')) {
            throw new Error('Play RTDN received_at index is missing.');
          }
          if (indexColumns.length !== 1 || indexColumns[0]?.name !== 'received_at') {
            throw new Error('Play RTDN received_at index definition is invalid.');
          }
          if (!indexes.some((row) => Number(row.unique) === 1 && row.origin === 'pk')) {
            throw new Error('Play RTDN primary-key uniqueness is missing.');
          }
          const tableSql = schemaRows[0]?.sql?.replace(/\s+/g, ' ') ?? '';
          const expectedCheck = "CHECK (status IN ('processing', 'processed'))";
          if (!tableSql.includes(expectedCheck)) throw new Error('Play RTDN status CHECK is missing.');
          console.log('Play RTDN schema read-back passed.');
          NODE

      - name: Sync Worker secrets and deploy
        run: npm run deploy:doppler


      - name: Verify live rewarded SSV endpoint
        run: node ../scripts/check-backend-reward-ssv.mjs

      - name: Verify live endpoints
        run: |
          health_url="${BACKEND_BASE_URL%/}/api/v1/health"
          privacy_url="${BACKEND_BASE_URL%/}/privacy?deploy=${GITHUB_SHA}"
          terms_url="${BACKEND_BASE_URL%/}/terms?deploy=${GITHUB_SHA}"
          deletion_page_url="${BACKEND_BASE_URL%/}/delete-account?deploy=${GITHUB_SHA}"
          delete_api_url="${BACKEND_BASE_URL%/}/api/v1/users/me"
          admin_url="${BACKEND_BASE_URL%/}/api/v1/admin/content/backfill"

          for attempt in 1 2 3 4 5 6 7 8; do
            health_status="$(curl --silent --show-error --output "$RUNNER_TEMP/health.json" --write-out '%{http_code}' "$health_url" || true)"
            privacy_status="$(curl --silent --show-error --output "$RUNNER_TEMP/privacy.html" --write-out '%{http_code}' "$privacy_url" || true)"
            terms_status="$(curl --silent --show-error --output "$RUNNER_TEMP/terms.html" --write-out '%{http_code}' "$terms_url" || true)"
            deletion_page_status="$(curl --silent --show-error --output "$RUNNER_TEMP/delete-account.html" --write-out '%{http_code}' "$deletion_page_url" || true)"
            delete_api_status="$(curl --silent --show-error --output "$RUNNER_TEMP/delete-api.json" --write-out '%{http_code}' --request DELETE "$delete_api_url" || true)"
            admin_status="$(curl --silent --show-error --output "$RUNNER_TEMP/admin.json" --write-out '%{http_code}' --request POST "$admin_url" || true)"

            if [ "$health_status" = "200" ] \
              && [ "$privacy_status" = "200" ] \
              && [ "$terms_status" = "200" ] \
              && [ "$deletion_page_status" = "200" ] \
              && [ "$delete_api_status" = "401" ] \
              && [ "$admin_status" = "403" ] \
              && grep -q 'Gizlilik Politikası' "$RUNNER_TEMP/privacy.html" \
              && grep -q 'Kullanım Koşulları' "$RUNNER_TEMP/terms.html" \
              && grep -q 'Hesap ve Veri Silme' "$RUNNER_TEMP/delete-account.html" \
              && grep -q 'info@parsfilo.com' "$RUNNER_TEMP/delete-account.html"; then
              echo "Live verification passed on attempt $attempt."
              exit 0
            fi

            echo "Attempt $attempt failed: health=$health_status privacy=$privacy_status terms=$terms_status deletion_page=$deletion_page_status delete_api=$delete_api_status admin=$admin_status"
            sleep 5
          done

          echo "Live verification failed after all retries."
          for file in health.json privacy.html terms.html delete-account.html delete-api.json admin.json; do
            echo "--- $file"
            head -c 500 "$RUNNER_TEMP/$file" || true
            echo
          done
          exit 1

      - name: Publish deployment summary
        run: |
          {
            echo '## Backend production deployment'
            echo
            echo "- Worker: astrology-backend"
            echo "- Git SHA: $GITHUB_SHA"
            echo "- Health: ${BACKEND_BASE_URL%/}/api/v1/health"
            echo "- Privacy: ${BACKEND_BASE_URL%/}/privacy"
            echo "- Terms: ${BACKEND_BASE_URL%/}/terms"
            echo "- Account deletion: ${BACKEND_BASE_URL%/}/delete-account"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Remove deployment secret files
        if: always()
        run: rm -f "$RUNNER_TEMP/doppler-secrets.json" "$RUNNER_TEMP/play-rtdn-schema.json"
