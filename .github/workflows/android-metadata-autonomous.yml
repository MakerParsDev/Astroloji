name: android-metadata-autonomous

on:
  workflow_call:
    inputs:
      release_sha:
        required: true
        type: string
  schedule:
    - cron: '43 3 * * *'
  workflow_dispatch:

concurrency:
  group: android-metadata-autonomous
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

jobs:
  reconcile:
    if: >-
      github.repository == 'MakerParsDev/Astroloji' &&
      vars.ENABLE_AUTONOMOUS_PRODUCTION == 'true' &&
      vars.ENABLE_METADATA_PUBLISH == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    env:
      PLAY_PACKAGE_NAME: ${{ vars.PACKAGE_NAME }}
      RELEASE_SHA: ${{ inputs.release_sha || github.sha }}
      DOPPLER_PROJECT: ${{ vars.DOPPLER_PROJECT }}
      DOPPLER_CONFIG: ${{ vars.DOPPLER_CONFIG }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ env.RELEASE_SHA }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify immutable current main metadata SHA
        run: |
          test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
          git fetch --no-tags --no-recurse-submodules origin main
          test "$(git rev-parse origin/main)" = "$RELEASE_SHA"

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24

      - name: Validate canonical Play metadata
        run: |
          node scripts/validate-play-metadata.mjs
          node --test             scripts/play-store-config.test.mjs             scripts/play-copy-quality.test.mjs             scripts/play-assets.test.mjs             scripts/play-diff.test.mjs             scripts/play-publication.test.mjs

      - name: Install pinned Doppler CLI
        env:
          DOPPLER_VERSION: 3.76.1
          DOPPLER_SHA256: e35230bd21fdbd7e41ddcb24672ec61cecefdb22de244d0216ea6b59853f63f2
        run: |
          set -euo pipefail
          archive="doppler_${DOPPLER_VERSION}_linux_amd64.tar.gz"
          url="https://github.com/DopplerHQ/cli/releases/download/${DOPPLER_VERSION}/${archive}"
          curl --fail --silent --show-error --location \
            --proto '=https' --proto-redir '=https' \
            "$url" --output "$RUNNER_TEMP/$archive"
          echo "$DOPPLER_SHA256  $RUNNER_TEMP/$archive" | sha256sum --check
          mkdir -p "$RUNNER_TEMP/doppler-bin"
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP/doppler-bin" doppler
          chmod 0755 "$RUNNER_TEMP/doppler-bin/doppler"
          echo "$RUNNER_TEMP/doppler-bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/doppler-bin/doppler" --version

      - name: Resolve Play service account
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -n "$DOPPLER_TOKEN" ]; then
            doppler secrets download               --project "${DOPPLER_PROJECT:-mobil-apps}"               --config "${DOPPLER_CONFIG:-astrology}"               --format json               --no-file > "$RUNNER_TEMP/doppler-secrets.json"
            chmod 600 "$RUNNER_TEMP/doppler-secrets.json"
          fi
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const dopplerPath = process.env.RUNNER_TEMP + '/doppler-secrets.json';
          const doppler = fs.existsSync(dopplerPath)
            ? JSON.parse(fs.readFileSync(dopplerPath, 'utf8'))
            : {};
          const pick = (name) => {
            const value = doppler[name];
            return typeof value === 'string' ? value : value?.computed || '';
          };
          const json = process.env.PLAY_SERVICE_ACCOUNT_JSON
            || process.env.GOOGLE_SERVICE_ACCOUNT_JSON
            || pick('PLAY_SERVICE_ACCOUNT_JSON')
            || pick('GOOGLE_SERVICE_ACCOUNT_JSON');
          if (!json) throw new Error('Missing Play service account JSON.');
          const parsed = JSON.parse(json);
          if (parsed.type !== 'service_account' || !parsed.client_email || !parsed.private_key) {
            throw new Error('Play service account JSON is invalid.');
          }
          fs.writeFileSync(
            process.env.RUNNER_TEMP + '/play-service-account.json',
            json,
            { mode: 0o600 },
          );
          NODE

      - name: Reverify current main immediately before production mutation
        run: |
          git fetch --no-tags --no-recurse-submodules origin main
          test "$(git rev-parse origin/main)" = "$RELEASE_SHA"

      - name: Reconcile canonical metadata with live Play state
        env:
          PLAY_SERVICE_ACCOUNT_JSON_PATH: ${{ runner.temp }}/play-service-account.json
        run: node scripts/reconcile-play-metadata.mjs

      - name: Open or update incident on metadata reconciliation failure
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          title="Autonomous Play metadata reconciliation failed"
          body="Play metadata reconciliation failed closed. Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          existing="$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "$title in:title" --json number --jq '.[0].number // empty')"
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --repo "$GITHUB_REPOSITORY" --body "$body"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --body "$body"
          fi

      - name: Remove Play credential files
        if: always()
        run: rm -f "$RUNNER_TEMP/doppler-secrets.json" "$RUNNER_TEMP/play-service-account.json"
