name: ci

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
      - name: Secret scan
        run: node scripts/scan-secrets.mjs
      - name: Release tooling tests
        run: node --test scripts/*.test.mjs

  backend-verify:
    runs-on: ubuntu-latest
    needs: secret-scan
    permissions:
      contents: read
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Verify autonomous migration safety
        env:
          MIGRATION_BASE: ${{ github.event.pull_request.base.sha || github.event.before || '' }}
          MIGRATION_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          if [ -n "$MIGRATION_BASE" ] && [[ ! "$MIGRATION_BASE" =~ ^0+$ ]]; then
            MIGRATION_BASE="$(git merge-base "$MIGRATION_BASE" "$MIGRATION_HEAD")"
            export MIGRATION_BASE
          fi
          node ../scripts/validate-autonomous-migrations.mjs

      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Build transition Worker
        run: npm run build:transition
      - name: Test
        run: npm test
      - name: Runtime smoke tests
        run: npm run test:runtime
      - name: Transition runtime smoke tests
        run: npm run test:runtime:transition

  android-verify:
    runs-on: ubuntu-latest
    needs: secret-scan
    defaults:
      run:
        working-directory: Astroloji
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "21"
      - name: Prepare CI Gradle settings
        run: |
          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx3072m -XX:MaxMetaspaceSize=1024m -Dfile.encoding=UTF-8
          org.gradle.daemon=false
          kotlin.code.style=official
          CRASHLYTICS_MAPPING_UPLOAD_ENABLED=false
          android.experimental.enableScreenshotTest=true
          android.sync.suppressAgpWarnings=UNSUPPORTED_PROJECT_OPTION_USE
          EOF
      - name: Ensure Gradle wrapper is executable
        run: chmod +x ./gradlew
      - name: Prepare Firebase placeholder config
        run: cp app/google-services.example.json app/google-services.json
      - name: Detekt
        run: ./gradlew :app:detekt
      - name: ktlint
        run: ./gradlew :app:ktlintCheck
      - name: Android Lint
        run: ./gradlew :app:lintDebug
      - name: Play store and paywall screenshot tests
        run: ./gradlew :app:validateDebugScreenshotTest -Pandroid.experimental.enableScreenshotTest=true -Pandroid.sync.suppressAgpWarnings=UNSUPPORTED_PROJECT_OPTION_USE
      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest
      - name: Device smoke APK compile
        run: ./gradlew :device-smoke:assembleDebug :device-smoke:assembleDebugAndroidTest
      - name: Assemble debug
        run: ./gradlew :app:assembleDebug
      - name: Bundle release dry-run
        env:
          ADMOB_APP_ID: ca-app-pub-3940256099942544~3347511713
          ADMOB_BANNER_ID: ca-app-pub-3940256099942544/9214589741
          ADMOB_INTERSTITIAL_ID: ca-app-pub-3940256099942544/1033173712
          ADMOB_REWARDED_ID: ca-app-pub-3940256099942544/5224354917
          ADMOB_REWARDED_INTERSTITIAL_ID: ca-app-pub-3940256099942544/5354046379
          ADMOB_APP_OPEN_ID: ca-app-pub-3940256099942544/9257395921
          ADMOB_NATIVE_ADVANCED_ID: ca-app-pub-3940256099942544/2247696110
        run: ./gradlew :app:bundleRelease
