name: opencode-pr-policy

on:
  pull_request_target:
    types: [opened, synchronize, reopened, labeled, unlabeled]

concurrency:
  group: opencode-pr-policy-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  classify:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      startsWith(github.event.pull_request.head.ref, 'opencode/')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
      statuses: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false

      - name: Classify autonomous PR risk
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            const path = require('path')
            const { pathToFileURL } = require('url')
            const { owner, repo } = context.repo
            const pull_number = context.payload.pull_request.number

            if (context.payload.action === 'synchronize') {
              try {
                await github.rest.issues.removeLabel({
                  owner,
                  repo,
                  issue_number: pull_number,
                  name: 'human-approved',
                })
              } catch (error) {
                if (error.status !== 404) throw error
              }
            }

            const policyModule = pathToFileURL(
              path.join(process.env.GITHUB_WORKSPACE, 'scripts/autonomous-policy.mjs'),
            ).href
            const { AUTONOMOUS_POLICY, classifyAutonomousChange } = await import(policyModule)
            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner, repo, pull_number, per_page: 100,
            })
            const totalChanges = files.reduce(
              (sum, file) => sum + file.additions + file.deletions,
              0,
            )
            const result = classifyAutonomousChange({
              paths: files.map((file) => file.filename),
              totalChanges,
            })
            const highRisk = result.risk === 'high'

            await github.rest.repos.createCommitStatus({
              owner,
              repo,
              sha: context.payload.pull_request.head.sha,
              state: highRisk ? 'failure' : 'success',
              context: 'autonomous-risk-low',
              description: highRisk
                ? 'Autonomous policy requires explicit human control.'
                : 'Autonomous policy allows low-risk automation.',
            })

            const add = highRisk
              ? ['opencode-autonomous', 'risk:high', 'needs-human']
              : ['opencode-autonomous', 'risk:low']
            const remove = highRisk
              ? ['risk:low']
              : ['risk:high', 'needs-human']

            for (const name of remove) {
              try {
                await github.rest.issues.removeLabel({
                  owner, repo, issue_number: pull_number, name,
                })
              } catch (error) {
                if (error.status !== 404) throw error
              }
            }
            await github.rest.issues.addLabels({
              owner, repo, issue_number: pull_number, labels: add,
            })

            core.summary
              .addHeading('OpenCode autonomous PR policy')
              .addRaw(`Risk: ${result.risk}\n\n`)
              .addRaw(`Files: ${result.files} / ${AUTONOMOUS_POLICY.maxFiles}\n\n`)
              .addRaw(`Changed lines: ${result.changedLines} / ${AUTONOMOUS_POLICY.maxChangedLines}\n\n`)
            if (result.reasons.length) {
              core.summary.addHeading('Human-control reasons', 3)
              core.summary.addList(result.reasons)
            }
            await core.summary.write()
