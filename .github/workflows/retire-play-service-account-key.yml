name: retire-play-service-account-key

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type RETIRE_LEGACY_KEY to delete the explicitly supplied legacy IAM key."
        required: true
        type: string
      key_id:
        description: "Legacy Google IAM service-account key ID (40 hexadecimal characters)."
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: retire-play-service-account-key
  cancel-in-progress: false

jobs:
  retire-key:
    if: github.repository == 'MakerParsDev/Astroloji' && inputs.confirm == 'RETIRE_LEGACY_KEY'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: internal
    env:
      DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
      DOPPLER_PROJECT: ${{ vars.DOPPLER_PROJECT }}
      DOPPLER_CONFIG: ${{ vars.DOPPLER_CONFIG }}
      EXPECTED_SERVICE_ACCOUNT_EMAIL: oaslananka-ops-play@makerpars-oaslananka-mobil.iam.gserviceaccount.com
      TARGET_KEY_ID: ${{ inputs.key_id }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Validate retirement configuration
        shell: bash
        run: |
          test -n "$DOPPLER_TOKEN" || { echo 'Missing internal DOPPLER_TOKEN.'; exit 1; }
          test -n "$DOPPLER_PROJECT" || { echo 'Missing DOPPLER_PROJECT.'; exit 1; }
          test -n "$DOPPLER_CONFIG" || { echo 'Missing DOPPLER_CONFIG.'; exit 1; }
          [[ "$TARGET_KEY_ID" =~ ^[a-fA-F0-9]{40}$ ]] || {
            echo 'key_id must be exactly 40 hexadecimal characters.'
            exit 1
          }

      - name: Install Doppler CLI
        run: curl -Ls https://cli.doppler.com/install.sh | sudo sh

      - name: Download Doppler credentials
        shell: bash
        run: |
          umask 077
          doppler secrets download \
            --project "$DOPPLER_PROJECT" \
            --config "$DOPPLER_CONFIG" \
            --format json \
            --no-file \
            > "$RUNNER_TEMP/doppler-secrets.json"

      - name: Retire legacy service-account key
        env:
          DOPPLER_SECRETS_JSON_PATH: ${{ runner.temp }}/doppler-secrets.json
        run: node scripts/retire-google-service-account-key.mjs

      - name: Publish security summary
        shell: bash
        run: |
          {
            echo '## Play service-account key retirement'
            echo "- Service account: $EXPECTED_SERVICE_ACCOUNT_EMAIL"
            echo "- Retired key ID: $TARGET_KEY_ID"
            echo '- Active Doppler key: verified after deletion'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Remove downloaded credentials
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/doppler-secrets.json"
