name: backend-admin-secret-sync

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type ROTATE_ADMIN_SECRET to sync the GitHub production ADMIN_SECRET to Cloudflare."
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: backend-admin-secret-sync
  cancel-in-progress: false

jobs:
  sync:
    if: github.repository == 'MakerParsDev/Astroloji' && github.ref == 'refs/heads/main' && inputs.confirm == 'ROTATE_ADMIN_SECRET'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    defaults:
      run:
        working-directory: backend
        shell: bash
    env:
      ADMIN_SECRET: ${{ secrets.ADMIN_SECRET }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      BACKEND_BASE_URL: https://astrology.parsfilo.com
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Validate rotation configuration
        run: |
          missing=0
          for name in ADMIN_SECRET CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID; do
            if [ -z "${!name:-}" ]; then
              echo "Missing required production setting: $name"
              missing=1
            fi
          done
          exit "$missing"

      - name: Install dependencies
        run: npm ci

      - name: Sync admin secret to Cloudflare
        run: printf '%s' "$ADMIN_SECRET" | npx wrangler secret put ADMIN_SECRET

      - name: Verify rotated admin boundary
        run: |
          admin_url="${BACKEND_BASE_URL%/}/api/v1/admin/content/backfill"

          for attempt in 1 2 3 4 5 6 7 8; do
            unauthorized_status="$(
              curl --silent --show-error \
                --output "$RUNNER_TEMP/admin-unauthorized.json" \
                --write-out '%{http_code}' \
                --request POST \
                --header 'content-type: application/json' \
                --data 'not-json' \
                "$admin_url" || true
            )"
            authorized_status="$(
              curl --silent --show-error \
                --output "$RUNNER_TEMP/admin-authorized.json" \
                --write-out '%{http_code}' \
                --request POST \
                --header 'content-type: application/json' \
                --header "x-admin-secret: $ADMIN_SECRET" \
                --data 'not-json' \
                "$admin_url" || true
            )"

            if [ "$unauthorized_status" = "403" ] && [ "$authorized_status" = "400" ]; then
              echo "Admin secret verification passed on attempt $attempt."
              exit 0
            fi

            echo "Attempt $attempt failed: unauthorized=$unauthorized_status authorized=$authorized_status"
            sleep 5
          done

          echo 'Admin secret verification failed after all retries.'
          for file in admin-unauthorized.json admin-authorized.json; do
            echo "--- $file"
            head -c 500 "$RUNNER_TEMP/$file" || true
            echo
          done
          exit 1
