name: backend-admob-ssv-verification-challenge

on:
  workflow_dispatch:
    inputs:
      command:
        description: "Choose the short-lived AdMob SSV challenge operation."
        required: true
        type: choice
        options:
          - create
          - inspect
          - delete
          - callback
      confirm:
        description: "Type MANAGE_ADMOB_SSV_CHALLENGE to continue."
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: backend-admob-ssv-verification-challenge
  cancel-in-progress: false

jobs:
  manage:
    if: >-
      github.repository == 'MakerParsDev/Astroloji' &&
      github.ref == 'refs/heads/main' &&
      inputs.confirm == 'MANAGE_ADMOB_SSV_CHALLENGE' &&
      contains(fromJSON('["create","inspect","delete","callback"]'), inputs.command)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    defaults:
      run:
        shell: bash
    env:
      DOPPLER_PROJECT: ${{ vars.DOPPLER_PROJECT }}
      DOPPLER_CONFIG: ${{ vars.DOPPLER_CONFIG }}
      ENABLE_PRODUCTION_RELEASE: ${{ vars.ENABLE_PRODUCTION_RELEASE }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Validate production gate
        env:
          INPUT_COMMAND: ${{ inputs.command }}
        run: |
          missing=0
          for name in DOPPLER_PROJECT DOPPLER_CONFIG; do
            if [ -z "${!name:-}" ]; then
              echo "Missing required challenge setting: $name"
              missing=1
            fi
          done
          if [ "$INPUT_COMMAND" = "callback" ] && [ -z "${CLOUDFLARE_ACCOUNT_ID:-}" ]; then
            echo "Missing required callback setting: CLOUDFLARE_ACCOUNT_ID"
            missing=1
          fi
          if [ "${ENABLE_PRODUCTION_RELEASE:-}" != "false" ]; then
            echo "ENABLE_PRODUCTION_RELEASE must remain false during AdMob verification."
            missing=1
          fi
          exit "$missing"

      - name: Validate and mask challenge secrets
        if: inputs.command != 'callback'
        env:
          ADMOB_SSV_TEST_USER_ID: ${{ secrets.ADMOB_SSV_TEST_USER_ID }}
          ADMOB_SSV_TEST_CUSTOM_DATA: ${{ secrets.ADMOB_SSV_TEST_CUSTOM_DATA }}
          INPUT_COMMAND: ${{ inputs.command }}
        run: |
          if [ -z "${ADMOB_SSV_TEST_CUSTOM_DATA:-}" ]; then
            echo 'ADMOB_SSV_TEST_CUSTOM_DATA is required.'
            exit 1
          fi
          if { [ "$INPUT_COMMAND" = "create" ] || [ "$INPUT_COMMAND" = "delete" ]; } && [ -z "${ADMOB_SSV_TEST_USER_ID:-}" ]; then
            echo 'ADMOB_SSV_TEST_USER_ID is required for create and delete.'
            exit 1
          fi
          echo "::add-mask::$ADMOB_SSV_TEST_CUSTOM_DATA"
          if [ -n "${ADMOB_SSV_TEST_USER_ID:-}" ]; then
            echo "::add-mask::$ADMOB_SSV_TEST_USER_ID"
          fi
          node <<'NODE'
          const challenge = process.env.ADMOB_SSV_TEST_CUSTOM_DATA ?? '';
          const userId = process.env.ADMOB_SSV_TEST_USER_ID ?? '';
          const uuid = /^[0-9a-f]{8}-[0-9a-f]{4}-[1-8][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$/i;
          if (!uuid.test(challenge)) throw new Error('Custom data must be a UUID.');
          if (['create', 'delete'].includes(process.env.INPUT_COMMAND ?? '')) {
            if (!userId.startsWith('admob-verify-') || !uuid.test(userId.slice('admob-verify-'.length))) {
              throw new Error('User ID must use the admob-verify-<uuid> namespace.');
            }
          }
          console.log('Validated and masked short-lived challenge secrets.');
          NODE

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Install pinned Doppler CLI
        env:
          DOPPLER_VERSION: 3.76.1
          DOPPLER_SHA256: e35230bd21fdbd7e41ddcb24672ec61cecefdb22de244d0216ea6b59853f63f2
        run: |
          set -euo pipefail
          archive="doppler_${DOPPLER_VERSION}_linux_amd64.tar.gz"
          url="https://github.com/DopplerHQ/cli/releases/download/${DOPPLER_VERSION}/${archive}"
          curl --fail --location --silent --show-error "$url" -o "$RUNNER_TEMP/$archive"
          echo "$DOPPLER_SHA256  $RUNNER_TEMP/$archive" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" doppler
          sudo install -m 0755 "$RUNNER_TEMP/doppler" /usr/local/bin/doppler
          doppler --version

      - name: Create verification challenge
        if: inputs.command == 'create'
        working-directory: backend
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
          ADMOB_SSV_TEST_USER_ID: ${{ secrets.ADMOB_SSV_TEST_USER_ID }}
          ADMOB_SSV_TEST_CUSTOM_DATA: ${{ secrets.ADMOB_SSV_TEST_CUSTOM_DATA }}
        run: |
          set -euo pipefail
          if [ -z "${DOPPLER_TOKEN:-}" ]; then echo 'DOPPLER_TOKEN is required.'; exit 1; fi
          CLOUDFLARE_API_TOKEN="$(doppler secrets get CLOUDFLARE_API_TOKEN --plain --project "$DOPPLER_PROJECT" --config "$DOPPLER_CONFIG")"
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then echo 'CLOUDFLARE_API_TOKEN is required.'; exit 1; fi
          echo "::add-mask::$CLOUDFLARE_API_TOKEN"
          env -u DOPPLER_TOKEN CLOUDFLARE_API_TOKEN="$CLOUDFLARE_API_TOKEN" \
            npm run --silent transition:challenge:create > "$RUNNER_TEMP/admob-ssv-redacted-evidence.json"

      - name: Inspect verification challenge
        if: inputs.command == 'inspect'
        working-directory: backend
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
          ADMOB_SSV_TEST_CUSTOM_DATA: ${{ secrets.ADMOB_SSV_TEST_CUSTOM_DATA }}
        run: |
          set -euo pipefail
          if [ -z "${DOPPLER_TOKEN:-}" ]; then echo 'DOPPLER_TOKEN is required.'; exit 1; fi
          CLOUDFLARE_API_TOKEN="$(doppler secrets get CLOUDFLARE_API_TOKEN --plain --project "$DOPPLER_PROJECT" --config "$DOPPLER_CONFIG")"
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then echo 'CLOUDFLARE_API_TOKEN is required.'; exit 1; fi
          echo "::add-mask::$CLOUDFLARE_API_TOKEN"
          env -u DOPPLER_TOKEN CLOUDFLARE_API_TOKEN="$CLOUDFLARE_API_TOKEN" \
            npm run --silent transition:challenge:inspect > "$RUNNER_TEMP/admob-ssv-redacted-evidence.json"

      - name: Delete verification challenge from D1
        if: inputs.command == 'delete'
        working-directory: backend
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
          ADMOB_SSV_TEST_USER_ID: ${{ secrets.ADMOB_SSV_TEST_USER_ID }}
          ADMOB_SSV_TEST_CUSTOM_DATA: ${{ secrets.ADMOB_SSV_TEST_CUSTOM_DATA }}
        run: |
          set -euo pipefail
          if [ -z "${DOPPLER_TOKEN:-}" ]; then echo 'DOPPLER_TOKEN is required.'; exit 1; fi
          CLOUDFLARE_API_TOKEN="$(doppler secrets get CLOUDFLARE_API_TOKEN --plain --project "$DOPPLER_PROJECT" --config "$DOPPLER_CONFIG")"
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then echo 'CLOUDFLARE_API_TOKEN is required.'; exit 1; fi
          echo "::add-mask::$CLOUDFLARE_API_TOKEN"
          env -u DOPPLER_TOKEN CLOUDFLARE_API_TOKEN="$CLOUDFLARE_API_TOKEN" \
            npm run --silent transition:challenge:delete > "$RUNNER_TEMP/admob-ssv-redacted-evidence.json"

      - name: Inspect redacted SSV callback results
        if: inputs.command == 'callback'
        working-directory: backend
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
          SSV_WORKER_NAME: astrology-ssv-transition
          SSV_LOOKBACK_MINUTES: '360'
          SSV_RESULT_LIMIT: '20'
        run: |
          set -euo pipefail
          if [ -z "${DOPPLER_TOKEN:-}" ]; then echo 'DOPPLER_TOKEN is required.'; exit 1; fi
          CLOUDFLARE_API_TOKEN="$(doppler secrets get CLOUDFLARE_API_TOKEN --plain --project "$DOPPLER_PROJECT" --config "$DOPPLER_CONFIG")"
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then echo 'CLOUDFLARE_API_TOKEN is required.'; exit 1; fi
          echo "::add-mask::$CLOUDFLARE_API_TOKEN"
          env -u DOPPLER_TOKEN CLOUDFLARE_API_TOKEN="$CLOUDFLARE_API_TOKEN" \
            CLOUDFLARE_ACCOUNT_ID="$CLOUDFLARE_ACCOUNT_ID" \
            SSV_WORKER_NAME="$SSV_WORKER_NAME" \
            SSV_LOOKBACK_MINUTES="$SSV_LOOKBACK_MINUTES" \
            SSV_RESULT_LIMIT="$SSV_RESULT_LIMIT" \
            npm run --silent transition:callback:inspect > "$RUNNER_TEMP/admob-ssv-redacted-evidence.json"

      - name: Publish redacted evidence
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = process.env.RUNNER_TEMP + '/admob-ssv-redacted-evidence.json';
          const evidence = JSON.parse(fs.readFileSync(path, 'utf8'));
          const allowedByOperation = {
            create: ['operation', 'challengePrefix', 'userPrefix', 'status', 'transactionPrefix', 'expiresAt'],
            inspect: ['operation', 'challengePrefix', 'userPrefix', 'status', 'transactionPrefix', 'expiresAt'],
            delete: ['operation', 'deletedChallengePrefix'],
            callback: ['operation', 'status', 'timestamp', 'scriptName', 'outcome', 'verifierCode', 'scriptVersion']
          };
          const allowed = allowedByOperation[evidence.operation];
          if (!allowed) throw new Error('Unexpected redacted evidence operation.');
          const unknown = Object.keys(evidence).filter((key) => !allowed.includes(key));
          if (unknown.length) throw new Error(`Unexpected redacted evidence keys: ${unknown.join(', ')}`);
          const lines = ['## AdMob SSV verification challenge', ''];
          for (const key of allowed) {
            lines.push(`- ${key}: ${evidence[key] ?? 'none'}`);
          }
          if (evidence.operation === 'delete') {
            lines.push('');
            lines.push('- Manual cleanup required: Delete these temporary repository secrets manually: ADMOB_SSV_TEST_USER_ID and ADMOB_SSV_TEST_CUSTOM_DATA.');
          }
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, lines.join('\n') + '\n');
          console.log(lines.join('\n'));
          NODE

      - name: Remove temporary evidence
        if: always()
        run: rm -f "$RUNNER_TEMP/admob-ssv-redacted-evidence.json"
